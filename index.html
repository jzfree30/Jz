<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0e12">
    <meta name="description" content="RADDCRAFT - Descarga Addons, Mods, Shaders, Texturas, Skins, Mundos y APK para Minecraft. Hecho por Radd y JZ.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230b0f13'/><text x='32' y='45' font-family='Arial,sans-serif' font-size='38' font-weight='bold' fill='%2300ffcc' text-anchor='middle'>R</text></svg>">
    <title>RADDCRAFT</title>
    <!-- Vercel Web Analytics: cuenta visitas, países, celulares... (no hace lenta la página) -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <style>
        * { box-sizing: border-box; }
        /* ===== FONDO NUEVO: noche oscura + resplandor cian arriba + dorado abajo + puntitos estrellas =====
           No usa imagen => carga rapidisimo y NUNCA se distorsiona al hacer scroll (Android/PC) */
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: #0a0e12;
            background-image:
                radial-gradient(ellipse 90% 55% at 15% -10%, rgba(0, 255, 204, 0.13), transparent 65%),
                radial-gradient(ellipse 80% 50% at 85% 110%, rgba(255, 190, 0, 0.09), transparent 65%),
                radial-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1.4px);
            background-size: 100% 100%, 100% 100%, 26px 26px;
            color: #fff; 
            margin: 0; 
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* ===== HEADER FIJO ARRIBA (PC y celular) ===== */
        header {
            position: sticky;
            top: 0;
            z-index: 200;
            background: rgba(12, 12, 12, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid #2a2a2a;
        }
        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
            padding: 10px 15px;
            position: relative;
        }
        .logo-container { display: flex; align-items: center; gap: 10px; }
        .logo-container img { height: 35px; object-fit: contain; }
        h1#siteTitle {
            color: #00ffcc; margin: 0; font-size: 20px;
            text-transform: uppercase; letter-spacing: 2px;
            transition: opacity 0.5s ease;
        }
        
        .menu-btn { background: rgba(30, 30, 30, 0.9); border: 1px solid #444; color: #fff; font-size: 20px; padding: 8px 14px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .menu-btn:hover { border-color: #00ffcc; color: #00ffcc; }
        
        .filters-dropdown {
            display: none;
            position: absolute;
            right: 15px;
            top: 56px;
            background: rgba(20, 20, 20, 0.97);
            backdrop-filter: blur(8px);
            border: 1px solid #333;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            flex-direction: column;
            gap: 4px;
            padding: 8px;
            z-index: 100;
            min-width: 195px;
        }
        .filters-dropdown button {
            background: transparent;
            border: none;
            color: #bbb;
            padding: 10px;
            text-align: left;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 8px;
        }
        .filters-dropdown button span {
            background: rgba(42, 42, 42, 0.8);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            color: #00ffcc;
        }
        .filters-dropdown button:hover, .filters-dropdown button.active {
            background: #00ffcc;
            color: #000;
            font-weight: bold;
        }
        .filters-dropdown button.active span { background: rgba(0,0,0,0.25); color: #000; }

        /* Botón especial para redirigir al Bot */
        .filters-dropdown button.btn-bot {
            border-top: 1px solid #333;
            margin-top: 6px;
            padding-top: 10px;
            color: #00ffcc;
            font-weight: bold;
        }
        .filters-dropdown button.btn-bot:hover {
            background: #00ffcc;
            color: #000;
        }

        .page-wrap {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 15px 15px 30px 15px;
            flex: 1;
        }

        .controls { margin-bottom: 15px; }
        input[type="text"] {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid #333; font-size: 15px;
            background: rgba(20, 20, 20, 0.85); color: #fff; outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: #00ffcc; }

        /* ===== BANNER (viene de tu Google Sheets, columna "Banner aquí") ===== */
        .banner {
            background: linear-gradient(90deg, rgba(255, 200, 0, 0.14), rgba(255, 152, 0, 0.14));
            border: 1px solid rgba(255, 200, 0, 0.6);
            color: #ffe082;
            border-radius: 10px;
            padding: 10px 14px;
            margin: 0 0 8px 0;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            line-height: 1.4;
            overflow-wrap: break-word;
            transition: opacity 0.5s ease;
        }

        /* Títulos con brillo luminoso */
        .carousel-title {
            font-size: 15px; color: #ffd700; margin: 15px auto 10px auto;
            text-transform: uppercase; letter-spacing: 1px;
            text-shadow: 0 0 14px rgba(255, 215, 0, 0.45);
        }
        .section-title {
            font-size: 15px; color: #00ffcc; margin: 20px auto 10px auto;
            text-transform: uppercase; letter-spacing: 1px;
            text-shadow: 0 0 14px rgba(0, 255, 204, 0.45);
        }
        .carousel-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            margin: 0 auto 20px auto;
            padding-bottom: 8px;
            scrollbar-width: thin;
            scrollbar-color: #00ffcc #1a1a1a;
        }
        .carousel-container::-webkit-scrollbar { height: 6px; }
        .carousel-container::-webkit-scrollbar-track { background: #1a1a1a; border-radius: 4px; }
        .carousel-container::-webkit-scrollbar-thumb { background: #00ffcc; border-radius: 4px; }

        /* ===== TARJETAS DESTACADAS (estrella POPULAR) ===== */
        .carousel-card {
            min-width: 230px;
            max-width: 230px;
            height: 195px;
            background: rgba(20, 20, 20, 0.92);
            backdrop-filter: blur(4px);
            border-radius: 14px;
            border: 1px solid rgba(255, 200, 0, 0.45);
            overflow: hidden;
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: 0.2s;
        }
        .carousel-card:hover {
            border-color: #ffd700;
            transform: translateY(-4px);
            box-shadow: 0 6px 18px rgba(255, 200, 0, 0.25);
        }
        .carousel-card img { width: 100%; height: 135px; object-fit: cover; transition: transform 0.3s ease; }
        .carousel-card:hover img { transform: scale(1.06); }
        .carousel-card .info { padding: 8px 10px; }
        .carousel-card h3 { font-size: 13px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .carousel-creator {
            font-size: 11px;
            color: #ffd700;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-popular {
            position: absolute;
            top: 10px;
            left: 10px;
            background: linear-gradient(135deg, #ffd700, #ff9800);
            color: #000;
            font-size: 10px;
            font-weight: 900;
            padding: 4px 8px;
            border-radius: 6px;
            box-shadow: 0 0 12px rgba(255, 200, 0, 0.7);
            z-index: 10;
            letter-spacing: 0.5px;
        }

        .badge-new {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #00ffcc;
            color: #000;
            font-size: 10px;
            font-weight: 900;
            padding: 3px 7px;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.8);
            z-index: 10;
            letter-spacing: 0.5px;
            animation: pulseGlow 2s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 6px rgba(0, 255, 204, 0.5); }
            50% { box-shadow: 0 0 15px rgba(0, 255, 204, 1); }
        }

        /* Cajita con el tipo (Shader, Addon, Mod...) en cada tarjeta */
        .badge-type {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(0, 255, 204, 0.5);
            color: #00ffcc;
            font-size: 9px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 5px;
            z-index: 10;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            max-width: 110px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .category-hero {
            margin: 0 auto 20px auto;
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(4px);
            border: 1px solid #00ffcc;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .category-hero img { width: 100%; height: 260px; object-fit: cover; }
        .category-hero .info { padding: 12px; }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 0 auto;
            align-items: stretch;
        }
        @media (min-width: 768px) {
            .grid-container { grid-template-columns: repeat(3, 1fr); gap: 15px; }
        }
        @media (min-width: 1024px) {
            .grid-container { grid-template-columns: repeat(4, 1fr); gap: 18px; }
        }
        @media (min-width: 1400px) {
            .grid-container { grid-template-columns: repeat(5, 1fr); gap: 20px; }
        }

        /* Animación suave de entrada */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card { 
            background: rgba(20, 20, 20, 0.9); 
            backdrop-filter: blur(4px); 
            padding: 10px; 
            border-radius: 12px; 
            border: 1px solid #333; 
            cursor: pointer; 
            transition: 0.2s; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            height: 185px;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.35s ease both;
        }
        .card:hover { border-color: #00ffcc; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0, 255, 204, 0.15); }
        .card img { 
            width: 100%; 
            height: 125px; 
            object-fit: cover; 
            border-radius: 8px; 
            background: #222;
            transition: transform 0.3s ease;
        }
        .card:hover img { transform: scale(1.06); }
        .card h3 { font-size: 13px; margin: 8px 0 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }

        /* ===== ESQUELETO DE CARGA (cajitas que parpadean) ===== */
        @keyframes skelPulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.9; } }
        .skel {
            height: 185px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: skelPulse 1.4s ease-in-out infinite;
        }

        .pagination { display: flex; justify-content: center; gap: 15px; margin: 25px 0; align-items: center; }
        .pagination button { padding: 8px 16px; background: rgba(34, 34, 34, 0.9); color: #fff; border: 1px solid #444; border-radius: 8px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .pagination button:hover:not(:disabled) { border-color: #00ffcc; color: #00ffcc; }
        .pagination button:disabled { opacity: 0.3; cursor: not-allowed; }
        #pageInfo { font-size: 14px; color: #aaa; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
        .modal-content { background: #222; width: 100%; max-width: 450px; padding: 20px; border-radius: 15px; position: relative; border: 1px solid #00ffcc; box-shadow: 0 0 20px rgba(0,255,204,0.2); }
        .modal-close { position: absolute; top: 12px; right: 15px; cursor: pointer; font-size: 22px; color: #fff; font-weight: bold; }
        .modal-content img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; }

        .btn-link { display: block; padding: 10px 12px; margin-top: 8px; text-align: center; background: #007bff; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 13px; transition: 0.2s; }
        .btn-link:hover { filter: brightness(1.15); }
        .btn-drive { background: #0f9d58; }
        .btn-curse { background: #f16436; }
        .btn-apk { background: #28a745; }

        /* ===== BOTÓN VOLVER ARRIBA ===== */
        #scrollTopBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #00ffcc;
            color: #000;
            border: none;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
            z-index: 500;
            box-shadow: 0 4px 12px rgba(0, 255, 204, 0.4);
        }
        #scrollTopBtn.show { opacity: 1; pointer-events: auto; }

        /* ===== FOOTER pequeño y discreto, siempre abajo ===== */
        footer {
            margin-top: auto;
            padding: 12px 15px 16px 15px;
            text-align: center;
            background: rgba(10, 10, 10, 0.55);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }
        .footer-text { color: #777; font-size: 11px; margin: 0 0 5px 0; line-height: 1.5; }
        .footer-text strong { color: #9adfd2; font-weight: 600; }
        .footer-wa {
            display: inline-block;
            font-size: 11px;
            color: #7ec98f;
            text-decoration: none;
            padding-bottom: 1px;
            border-bottom: 1px dotted rgba(126, 201, 143, 0.35);
            transition: 0.2s;
        }
        .footer-wa:hover { color: #a5e6b3; }
        .footer-copy { color: #555; font-size: 10px; margin: 7px 0 0 0; }

        /* ===== AJUSTES PARA CELULAR / ANDROID ===== */
        @media (max-width: 768px) {
            h1#siteTitle { font-size: 17px; letter-spacing: 1px; }
            .carousel-card { min-width: 185px; max-width: 185px; height: 190px; }
            .carousel-card img { height: 118px; }
            .category-hero img { height: 190px; }
            .card { height: 175px; }
            .card img { height: 118px; }
            .skel { height: 175px; }
            .badge-type { max-width: 75px; font-size: 8px; padding: 2px 4px; }
            .grid-container { gap: 10px; }
            .banner { font-size: 12px; }
            input[type="text"] { font-size: 16px; }
            .pagination { gap: 8px; }
            .pagination button { padding: 8px 12px; font-size: 13px; }
            #scrollTopBtn { bottom: 15px; right: 15px; }
        }
        @media (max-width: 480px) {
            .modal-overlay { padding: 10px; }
            .modal-content { padding: 15px; max-height: 92vh; overflow-y: auto; }
            .modal-content img { height: 160px; }
            #mDesc { max-height: 160px; }
        }
    </style>
</head>
<body>

        <div class="header-inner">

                <img src="https://i.ibb.co/TU_LOGO.jpg" alt="Logo" referrerpolicy="no-referrer" onerror="this.style.display='none'">

                <button onclick="setCategory('Mod', this)">🧪 Mods <span id="count-mod">0</span></button>

    <main class="page-wrap">
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Buscar por nombre, tipo, descripción o creador..." oninput="filterData()">
        </div>

        <div id="bannerContainer"></div>

        <div id="carouselSection" style="display:none;">
            <div class="carousel-title">⭐ Lo más Popular</div>
            <div id="carouselContainer" class="carousel-container"></div>
        </div>

        <div id="categoryHeroContainer"></div>

        <div class="section-title" id="sectionTitleLabel">Contenido Reciente</div>

            <div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>

        <div class="pagination">
            <button id="prevBtn" onclick="changePage(-1)">⬅ Anterior</button>

    <footer>
        <p class="footer-text">Hecho por <strong>Radd</strong> y <strong>JZ</strong> con cariño 🍷 · Un gusto ayudarlos con el contenido</p>
        <a class="footer-wa" href="https://whatsapp.com/channel/0029Vb6frcyChq6Iss2kow1x" target="_blank" rel="noopener">💬 Canal de WhatsApp</a>

        <button id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

    <div id="itemModal" class="modal-overlay" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="modal-close" onclick="closeModal()">×</span>
            <img id="mImg" src="" referrerpolicy="no-referrer">
            <h2 id="mTitle" style="color:#00ffcc; margin: 10px 0 3px 0; font-size: 17px;"></h2>
            <div id="mType" style="font-size: 11px; color: #00ffcc; font-weight: bold; margin-bottom: 4px; text-transform: uppercase;"></div>
            <div id="mCreator" style="font-size: 12px; color: #ffd700; font-weight: bold; margin-bottom: 8px;"></div>
            <p id="mDesc" style="color:#ccc; font-size: 13px; line-height: 1.4; max-height: 130px; overflow-y: auto; margin-bottom: 12px;"></p>
            <div id="mLinks"></div>
        </div>
    </div>

    <script>
        const JSON_URL = 'https://script.google.com/macros/s/AKfycbzLLDzXIwMwceUsD3yz1GXhYSxdGlhWk4eD_kTTxFf7YwvvAEOTr7a2OXOh1SEoVytS3Q/exec';
        let allData = [];
        let filteredData = [];
        let currentPage = 1;
        const itemsPerPage = 10;
        let currentCategory = 'ALL';
        
        const TOTAL_NEW_ITEMS = 6; 

        /* ⏱️ AQUÍ cambias los 15 segundos (título y banner) si un día quieres otra duración */
        const ROTATE_SECONDS = 15;

        /* ===== DIAGNÓSTICO: muestra el error en pantalla si algo falla ===== */
        function showError(msg) {
            let bar = document.getElementById('diagBar');
            if (!bar) {
                bar = document.createElement('div');
                bar.id = 'diagBar';
                document.body.appendChild(bar);
            }
            bar.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#b71c1c;color:#fff;font-size:12px;padding:10px;z-index:9999;text-align:center;line-height:1.4;';
            bar.textContent = '⚠️ ' + msg;
        }
        window.onerror = function(msg) {
            showError('Error de código: ' + msg);
            return false;
        };

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, function(s) {
                return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[s];
            });
        }

        /* Obtiene el creador (columna B "Creadores" de tu hoja) */
        function getCreator(item) {
            const c = item.creadores || item.creador || item.autor || item.creator || '';
            return String(c).trim();
        }

        /* ===== TÍTULO RADDCRAFT ↔ JATOZETA cada 15s ===== */
        const BRANDS = ['RADDCRAFT', 'JATOZETA'];
        const BRAND_COLORS = { RADDCRAFT: '#00ffcc', JATOZETA: '#ffd700' };
        let brandIndex = 0;
        let titleAnimating = false;
        const siteTitleEl = document.getElementById('siteTitle');

        function switchBrand() {
            if (!siteTitleEl || titleAnimating) return;
            titleAnimating = true;
            siteTitleEl.style.opacity = '0';
            setTimeout(function() {
                brandIndex = (brandIndex + 1) % BRANDS.length;
                if (siteTitleEl) {
                    siteTitleEl.textContent = BRANDS[brandIndex];
                    siteTitleEl.style.color = BRAND_COLORS[BRANDS[brandIndex]];
                    siteTitleEl.style.opacity = '1';
                }
                titleAnimating = false;
            }, 500);
        }
        setInterval(switchBrand, ROTATE_SECONDS * 1000);

        /* ===== BANNER desde tu Google Sheets (columna "Banner aquí", celda M1) =====
           Escribe los mensajes en la columna M, en filas que tengan contenido.
           1 mensaje = fijo. 2 o más = se turnan cada 15s. Vacío = no aparece. */
        let bannerMessages = [];
        let bannerIndex = 0;
        let bannerAnimating = false;

        function collectBanners() {
            const messages = [];
            const seen = new Set();
            allData.forEach(function(item) {
                if (!item) return;
                Object.keys(item).forEach(function(key) {
                    const k = key.toLowerCase();
                    if (k.indexOf('banner') !== -1 || k.indexOf('anuncio') !== -1) {
                        const val = String(item[key] || '').trim();
                        if (val && !seen.has(val)) { seen.add(val); messages.push(val); }
                    }
                });
            });
            return messages;
        }

        function renderBanner() {
            const wrap = document.getElementById('bannerContainer');
            if (!wrap) return;
            bannerMessages = collectBanners();
            bannerIndex = 0;
            if (bannerMessages.length === 0) { wrap.innerHTML = ''; return; }
            wrap.innerHTML = '<div class="banner" id="bannerBox">📢 ' + escapeHtml(bannerMessages[0]) + '</div>';
            if (bannerMessages.length > 1) {
                setInterval(function() {
                    const box = document.getElementById('bannerBox');
                    if (!box || bannerAnimating) return;
                    bannerAnimating = true;
                    box.style.opacity = '0';
                    setTimeout(function() {
                        bannerIndex = (bannerIndex + 1) % bannerMessages.length;
                        if (box) { box.textContent = '📢 ' + bannerMessages[bannerIndex]; box.style.opacity = '1'; }
                        bannerAnimating = false;
                    }, 500);
                }, ROTATE_SECONDS * 1000);
            }
        }

        function fixImgUrl(url) {
            if (!url || !url.trim() || !url.startsWith('http')) {
                return 'https://via.placeholder.com/300x180?text=No+Image';
            }
            let cleanUrl = url.trim();
            if (cleanUrl.includes('ibb.co') && !cleanUrl.includes('i.ibb.co')) {
                cleanUrl = cleanUrl.replace('ibb.co/', 'i.ibb.co/') + '.jpg';
            }
            return cleanUrl;
        }

        function handleImgError(img) {
            if (!img.dataset.retried) {
                img.dataset.retried = 'true';
                if (img.src.includes('i.ibb.co') && !img.src.endsWith('.jpg')) {
                    img.src = img.src + '.jpg';
                    return;
                }
            }
            img.src = 'https://via.placeholder.com/300x180?text=Error+Imagen';
        }

        async function loadData() {
            const list = document.getElementById('contentList');
            if (typeof fetch !== 'function') {
                if (list) list.innerHTML = "<p style='text-align:center; grid-column:1/-1; color:#ffb3b3;'>Tu navegador es muy antiguo para cargar el contenido.</p>";
                return;
            }
            try {
                /* Timeout de 20s para que no se quede "Cargando..." para siempre */
                const controller = new AbortController();
                const timer = setTimeout(function() { controller.abort(); }, 20000);
                const response = await fetch(JSON_URL, { signal: controller.signal });
                clearTimeout(timer);
                const data = await response.json();
                if (!Array.isArray(data)) throw new Error('La hoja no devolvió la lista de contenido');
                allData = data.reverse();
                filteredData = allData;
                updateCategoryCounts();
                renderBanner();
                renderPage();
            } catch (e) { 
                let msg = 'No se pudo cargar el contenido.';
                if (e && e.name === 'AbortError') msg = 'La conexión con Google Sheets tardó mucho (tiempo agotado).';
                else if (e && e.message) msg = e.message;
                if (list) list.innerHTML = "<p style='text-align:center; grid-column:1/-1; color:#ffb3b3; line-height:1.6;'>❌ " + escapeHtml(msg) + "<br>Espera un momento y recarga la página (F5).</p>";
            }
        }
                function updateCategoryCounts() {
            document.getElementById('count-all').innerText = allData.length;
            document.getElementById('count-addon').innerText = allData.filter(i => (i.tipo || '').toLowerCase().includes('addon')).length;
            document.getElementById('count-mod').innerText = allData.filter(i => (i.tipo || '').toLowerCase().includes('mod')).length;
            document.getElementById('count-mundo').innerText = allData.filter(i => (i.tipo || '').toLowerCase().includes('mundo')).length;
            document.getElementById('count-textura').innerText = allData.filter(i => (i.tipo || '').toLowerCase().includes('textura')).length;
            document.getElementById('count-shader').innerText = allData.filter(i => (i.tipo || '').toLowerCase().includes('shader')).length;
            document.getElementById('count-skin').innerText = allData.filter(i => (i.tipo || '').toLowerCase().includes('skin')).length;
            document.getElementById('count-mashup').innerText = allData.filter(i => (i.tipo || '').toLowerCase().includes('mashup')).length;
            document.getElementById('count-apk').innerText = allData.filter(i => (i.tipo || '').toLowerCase().includes('apk')).length;
        }

        function renderPage() {
            const carouselSection = document.getElementById('carouselSection');
            const categoryHeroContainer = document.getElementById('categoryHeroContainer');
            const searchVal = document.getElementById('searchInput').value.trim();

            /* Carrusel de destacados (⭐ POPULAR + creador) */
            if (currentPage === 1 && currentCategory === 'ALL' && !searchVal) {
                carouselSection.style.display = 'block';
                const featuredItems = allData.filter(i => ['1', '2', '3', '4'].includes(String(i.puesto || '').trim()));
                const carouselContainer = document.getElementById('carouselContainer');
                
                if (featuredItems.length > 0) {
                    carouselContainer.innerHTML = featuredItems.map((item) => {
                        const originalIndex = allData.indexOf(item);
                        const isRecent = originalIndex < TOTAL_NEW_ITEMS;
                        const creator = getCreator(item);
                        return `
                            <div class="carousel-card" onclick='openModalByIndex(${originalIndex})'>
                                <span class="badge-popular">⭐ POPULAR</span>
                                ${isRecent ? '<span class="badge-new">NEW</span>' : ''}
                                <img src="${fixImgUrl(item.imagen)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="handleImgError(this)">
                                <div class="info">
                                    <h3>${escapeHtml(item.nombre || 'Sin nombre')}</h3>
                                    ${creator ? `<div class="carousel-creator">👤 ${escapeHtml(creator)}</div>` : ''}
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    carouselContainer.innerHTML = "<p style='padding: 10px; color: #888; font-size: 13px;'>Coloca '1', '2', '3' o '4' en la columna 'puesto' para mostrar destacados aquí.</p>";
                }
            } else {
                carouselSection.style.display = 'none';
            }

            /* Destacado grande al entrar a una categoría (ej: "1 shader") */
            if (currentCategory !== 'ALL' && !searchVal) {
                const targetPuesto = `1 ${currentCategory.toLowerCase()}`;
                const heroItem = allData.find(i => String(i.puesto || '').toLowerCase().trim() === targetPuesto);
                
                if (heroItem) {
                    const originalIndex = allData.indexOf(heroItem);
                    const isRecent = originalIndex < TOTAL_NEW_ITEMS;
                    const heroCreator = getCreator(heroItem);
                    categoryHeroContainer.innerHTML = `
                        <div class="category-hero" onclick='openModalByIndex(${originalIndex})'>
                            ${isRecent ? '<span class="badge-new">NEW</span>' : ''}
                            <img src="${fixImgUrl(heroItem.imagen)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="handleImgError(this)">
                            <div class="info">
                                <h3>⭐ ${escapeHtml(heroItem.nombre || 'Destacado')}${heroCreator ? ` <small style="color:#ffd700; font-size:12px;">— por ${escapeHtml(heroCreator)}</small>` : ''}</h3>
                                <p>${escapeHtml(heroItem.descripcion || 'Toca para ver detalles')}</p>
                            </div>
                        </div>
                    `;
                } else {
                    categoryHeroContainer.innerHTML = '';
                }
            } else {
                categoryHeroContainer.innerHTML = '';
            }

            /* Lista de tarjetas (con cajita de tipo) */
            const list = document.getElementById('contentList');
            if (filteredData.length === 0) {
                const val = searchVal;
                list.innerHTML = val
                    ? `<p style='text-align:center; grid-column:1/-1; color:#888; font-size:14px; line-height:1.6;'>🔍 No encontramos nada para "${escapeHtml(val)}".<br>Prueba con otra palabra o elige una categoría desde el menú ☰</p>`
                    : "<p style='text-align:center; grid-column:1/-1; color:#888;'>No hay contenido disponible todavía.</p>";
                document.getElementById('pageInfo').innerText = "Página 1 de 1";
                document.getElementById('prevBtn').disabled = true;
                document.getElementById('nextBtn').disabled = true;
                return;
            }

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedItems = filteredData.slice(start, end);

            list.innerHTML = paginatedItems.map((item, idx) => {
                const originalIndex = allData.indexOf(item);
                const isRecent = originalIndex < TOTAL_NEW_ITEMS;
                const tipo = (item.tipo || '').trim();
                return `
                    <div class="card" style="animation-delay:${idx * 0.04}s" onclick='openModalByIndex(${originalIndex})'>
                        ${tipo ? `<span class="badge-type">${escapeHtml(tipo)}</span>` : ''}
                        ${isRecent ? '<span class="badge-new">NEW</span>' : ''}
                        <img src="${fixImgUrl(item.imagen)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="handleImgError(this)">
                        <h3>${escapeHtml(item.nombre || 'Sin nombre')}</h3>
                    </div>
                `;
            }).join('');

            updatePaginationControls();
        }

        function updatePaginationControls() {
            const maxPages = Math.ceil(filteredData.length / itemsPerPage) || 1;
            document.getElementById('pageInfo').innerText = `Página ${currentPage} de ${maxPages}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage >= maxPages;
        }

        function changePage(direction) {
            const maxPages = Math.ceil(filteredData.length / itemsPerPage);
            if (currentPage + direction >= 1 && currentPage + direction <= maxPages) {
                currentPage += direction;
                renderPage();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        /* Busca por nombre, tipo, descripción o creador */
        function filterData() {
            const val = document.getElementById('searchInput').value.toLowerCase().trim();
            filteredData = allData.filter(i => {
                const matchCat = currentCategory === 'ALL' || (i.tipo || '').toLowerCase().includes(currentCategory.toLowerCase());
                if (!matchCat) return false;
                if (!val) return true;
                const matchName = (i.nombre || '').toLowerCase().includes(val);
                const matchDesc = (i.descripcion || '').toLowerCase().includes(val);
                const matchType = (i.tipo || '').toLowerCase().includes(val);
                const matchCreator = (getCreator(i) || '').toLowerCase().includes(val);
                return matchName || matchDesc || matchType || matchCreator;
            });
            currentPage = 1;
            renderPage();
        }

        function toggleMenu() {
            const dropdown = document.getElementById('menuDropdown');
            dropdown.style.display = dropdown.style.display === 'flex' ? 'none' : 'flex';
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.filters-dropdown button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            toggleMenu();
            filterData();
        }

        function generateButtons(rawLink, rawDrive, itemType = '') {
            let html = '';

            function parseDriveUrl(url) {
                if (url.includes('drive.google.com')) {
                    let idMatch = url.match(/id=([a-zA-Z0-9_-]+)/) || url.match(/\/d\/([a-zA-Z0-9_-]+)/);
                    if (idMatch && idMatch[1]) {
                        return `https://drive.google.com/uc?export=download&id=${idMatch[1]}`;
                    }
                }
                return url;
            }

            function processLinks(linkString, isDriveSource = false) {
                if (!linkString) return '';
                const urls = String(linkString).split(',').map(s => s.trim()).filter(s => s.length > 0);
                if (urls.length === 0) return '';

                let mcpackCount = 0;
                urls.forEach(u => { if (u.toLowerCase().includes('.mcpack')) mcpackCount++; });

                let mcpackIndex = 0;
                let btnHtml = '';

                urls.forEach((url, idx) => {
                    const finalUrl = isDriveSource ? parseDriveUrl(url) : url;
                    const lowerUrl = url.toLowerCase();
                    const lowerType = itemType.toLowerCase();
                    let btnText = 'Descargar';
                    let btnClass = isDriveSource ? 'btn-link btn-drive' : 'btn-link';

                    const isApk = lowerType.includes('apk') || lowerUrl.includes('.apk');

                    if (isApk) {
                        btnClass += ' btn-apk';
                        let bitLabel = '';
                        if (lowerType.includes('64') || lowerUrl.includes('64')) bitLabel = ' (64 bits)';
                        else if (lowerType.includes('32') || lowerUrl.includes('32')) bitLabel = ' (32 bits)';

                        if (urls.length > 1) {
                            btnText = (idx === 0) ? `Descargar APK${bitLabel} Con Música` : `Descargar APK${bitLabel} Sin Música`;
                        } else {
                            btnText = `Descargar APK${bitLabel}`;
                        }
                    } else if (lowerUrl.includes('.mctemplate')) {
                        btnText = 'Descargar Mundo';
                    } else if (lowerUrl.includes('.mcaddon')) {
                        btnText = 'Descargar Addon';
                    } else if (lowerUrl.includes('.mcpack')) {
                        mcpackIndex++;
                        btnText = (mcpackCount > 1 && mcpackIndex > 1) ? 'Descargar Skin' : 'Descargar Textura';
                    } else if (lowerUrl.includes('curseforge.com')) {
                        btnText = 'Descargar Mod (CurseForge)';
                        btnClass += ' btn-curse';
                    } else {
                        btnText = isDriveSource ? 'Descargar (Drive)' : 'Descargar Directo';
                    }

                    btnHtml += `<a href="${finalUrl}" target="_blank" class="${btnClass}">${btnText}</a>`;
                });

                return btnHtml;
            }

            if (rawLink) html += processLinks(rawLink, false);
            if (rawDrive) html += processLinks(rawDrive, true);

            return html || '<p style="color:#aaa; font-size:12px; text-align:center;">No hay enlaces disponibles para este contenido.</p>';
        }

        function openModalByIndex(index) {
            const item = allData[index];
            if (!item) return;

            const modalImg = document.getElementById('mImg');
            modalImg.src = fixImgUrl(item.imagen);
            modalImg.onerror = function() { handleImgError(this); };

            document.getElementById('mTitle').innerText = item.nombre || '';
            document.getElementById('mType').innerText = item.tipo ? `📌 Categoría: ${item.tipo}` : '';
            const creator = getCreator(item);
            document.getElementById('mCreator').innerText = creator ? `👤 Creado por: ${creator}` : '';
            document.getElementById('mDesc').innerText = item.descripcion || 'Sin descripción disponible.';
            
            document.getElementById('mLinks').innerHTML = generateButtons(item.link, item.drive, item.tipo || '');
            document.getElementById('itemModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('itemModal').style.display = 'none';
            document.body.style.overflow = '';
        }

        /* Cerrar modal con la tecla ESC */
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        /* Botón volver arriba: aparece al hacer scroll */
        window.addEventListener('scroll', function() {
            const btn = document.getElementById('scrollTopBtn');
            if (btn) btn.classList.toggle('show', window.scrollY > 400);
        });

        /* Cerrar el menú al tocar fuera (version blindada para Android) */
        window.onclick = function(event) {
            try {
                const target = event && event.target;
                if (!target || typeof target.matches !== 'function') return;
                if (!target.matches('.menu-btn') && !target.closest('.filters-dropdown')) {
                    const dropdown = document.getElementById('menuDropdown');
                    if (dropdown && dropdown.style.display === 'flex') {
                        dropdown.style.display = 'none';
                    }
                }
            } catch (e) {
                /* si algo raro pasa al tocar, ignoramos para no romper la página */
            }
        };

        /* ===== VERIFICACIÓN E INICIO (independiente, a prueba de paste fallido) ===== */
        (function() {
            function fatal(msg) {
                const bar = document.createElement('div');
                bar.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#b71c1c;color:#fff;font-size:12px;padding:10px;z-index:9999;text-align:center;line-height:1.4;';
                bar.textContent = '⚠️ ' + msg;
                document.body.appendChild(bar);
            }
            try {
                const required = ['siteTitle','menuDropdown','searchInput','bannerContainer','carouselContainer','categoryHeroContainer','contentList','pageInfo','prevBtn','nextBtn','scrollTopBtn','itemModal','mImg','mTitle','mType','mCreator','mDesc','mLinks'];
                const missing = required.filter(function(id) { return !document.getElementById(id); });
                if (missing.length > 0) {
                    fatal('Código incompleto: faltan (' + missing.join(', ') + '). Pega las 4 partes seguidas (1.1, 1.2, 2.1, 2.2) en el mismo archivo, que empiece con <!DOCTYPE html> y termine con </html>.');
                    return;
                }
                if (typeof loadData !== 'function') {
                    fatal('La Parte 2.1 no quedó completa (falta la función de carga de datos).');
                    return;
                }
                loadData();
            } catch (err) {
                fatal('Error al iniciar: ' + (err && err.message ? err.message : err));
            }
        })();
    </script>
</body>
