<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>RADDCRAFT</title>
</head>
<body>
    <h1>RADDCRAFT</h1>
    <div id="contentList">Cargando...</div>
    <script>
        const JSON_URL = 'https://script.google.com/macros/s/AKfycbzLLDzXIwMwceUsD3yz1GXhYSxdGlhWk4eD_kTTxFf7YwvvAEOTr7a2OXOh1SEoVytS3Q/exec';
        
        async function load() {
            const res = await fetch(JSON_URL);
            const data = await res.json();
            document.getElementById('contentList').innerHTML = "¡Conectado! Tenemos " + data.length + " items.";
            console.log(data);
        }
        load();
    </script>
</body>
</html>
